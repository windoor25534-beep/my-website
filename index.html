<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN // OFFICIAL GANG UNIVERSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1a160d 0%, #050507 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            max-width: 440px;
            padding: 35px 20px;
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(212, 175, 55, 0.1);
            position: relative;
        }
        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            border-radius: 0 0 5px 5px;
            box-shadow: 0 0 15px #d4af37;
        }
        .badge-top {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: #f3e5ab;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 3px;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .main-title {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.6), 0 0 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
        }
        .sub-title {
            color: #b0a88e;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .gang-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #ded6be;
            font-size: 0.82rem;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: rgba(25, 22, 15, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 10px #d4af37;
        }
        .enter-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #241e0c 0%, #0d0a04 100%);
            border: 2px solid #d4af37;
            color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .enter-btn:hover {
            border-color: #f3e5ab;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(212, 175, 55, 0.3);
        }
        .enter-btn:active {
            transform: scale(0.96);
            background: #d4af37;
            color: #000;
        }
        .btn-text {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 6px;
            color: #f3e5ab;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }
        .enter-btn:active .btn-text {
            color: #000;
            text-shadow: none;
        }
        .btn-subtext {
            font-size: 0.68rem;
            color: #a3997c;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .enter-btn:active .btn-subtext {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="badge-top">ELITE SANCTUARY</div>
        
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE SUPREME EMPIRE</div>
        
        <div class="gang-info">
            <span class="dot"></span>
            <span>SECURE MEMBER ARCHIVES</span>
            <span class="dot"></span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">UNLOCK ROSTER</div>
            <div class="btn-subtext">[ TAP TO ENTER THE INNER CIRCLE ]</div>
        </a>
    </div>

</body>
</html>
