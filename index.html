<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - UNIVERSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050507;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .main-title {
            color: #ff1a40;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 26, 64, 0.9), 0 0 10px rgba(255, 26, 64, 0.5);
            margin-bottom: 10px;
        }
        .sub-title {
            color: #b0b0c0;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .discord-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #cfcfdf;
            font-size: 0.95rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }
        .diamond {
            color: #ff1a40;
            font-size: 0.8rem;
            text-shadow: 0 0 8px rgba(255, 26, 64, 0.8);
        }
        .divider {
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff1a40, transparent);
            margin-bottom: 40px;
        }
        .enter-btn {
            display: inline-block;
            background: rgba(20, 10, 12, 0.8);
            border: 2px solid #ff1a40;
            color: #ffffff;
            padding: 18px 35px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 26, 64, 0.3), inset 0 0 10px rgba(255, 26, 64, 0.2);
            transition: all 0.3s ease;
        }
        .enter-btn:active {
            transform: scale(0.95);
            background: #ff1a40;
            color: #000;
        }
        .btn-text {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px rgba(255, 26, 64, 0.8);
        }
        .btn-subtext {
            font-size: 0.75rem;
            color: #8b8b9e;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div>
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">DIS ONLYWIN UNIVERSE</div>
        
        <div class="divider"></div>

        <div class="discord-box">
            <span class="diamond">♦</span>
            <span>discord ONLYWIN</span>
            <span class="diamond">♦</span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">➜] MEMBER ENTER</div>
            <div class="btn-subtext">[ CLICK TO EXPLORE ROSTER & PLAY MUSIC ]</div>
        </a>
    </div>

</body>
</html>
