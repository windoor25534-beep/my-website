<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN // SUPREME EMPIRE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030305;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* พื้นหลังแสงเหนือเคลื่อนไหวแบบไฮเอนด์ */
        .aurora-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #030305, #140e02, #030305, #1f1402);
            background-size: 400% 400%;
            animation: auroraAnimation 10s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.95), 0 0 50px rgba(212, 175, 55, 0.15);
            position: relative;
            animation: floatBox 4s ease-in-out infinite;
        }

        @keyframes floatBox {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            border-radius: 0 0 5px 5px;
            box-shadow: 0 0 15px #d4af37;
        }

        .badge-top {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: #f3e5ab;
            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            margin-bottom: 22px;
            text-transform: uppercase;
        }

        .main-title {
            color: #ffffff;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.7), 0 0 10px rgba(212, 175, 55, 0.4);
            margin-bottom: 4px;
        }

        .sub-title {
            color: #9c9276;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .gang-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #d1c7a7;
            font-size: 0.75rem;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: rgba(20, 17, 10, 0.6);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .dot {
            width: 5px;
            height: 5px;
            background-color: #d4af37;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* ปุ่มกดดีไซน์หรูหราพร้อมอนิเมชันเด้งรับ */
        .enter-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1f190a 0%, #0a0803 100%);
            border: 2px solid #d4af37;
            color: #ffffff;
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .enter-btn:hover {
            border-color: #ffea85;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.5), inset 0 0 20px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        .enter-btn:active {
            transform: scale(0.94) translateY(2px);
            background: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
        }

        .btn-text {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 4px;
            color: #f3e5ab;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            transition: 0.2s;
        }

        .enter-btn:active .btn-text {
            color: #030305;
            text-shadow: none;
        }

        .btn-subtext {
            font-size: 0.65rem;
            color: #8c8266;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .enter-btn:active .btn-subtext {
            color: #222;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="wrapper">
        <div class="badge-top">ELITE SANCTUARY</div>
        
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE SUPREME EMPIRE</div>
        
        <div class="gang-info">
            <span class="dot"></span>
            <span>SECURE MEMBER ARCHIVES</span>
            <span class="dot"></span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">ENTER ROSTER</div>
            <div class="btn-subtext">[ TAP TO UNLOCK ]</div>
        </a>
    </div>

</body>
</html>
