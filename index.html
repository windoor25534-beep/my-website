<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN // OFFICIAL GANG UNIVERSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #140508 0%, #030305 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .wrapper {
            width: 100%;
            max-width: 440px;
            padding: 35px 20px;
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 26, 64, 0.2);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 26, 64, 0.08);
            position: relative;
        }
        .wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #ff1a40;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 0 15px #ff1a40;
        }
        .badge-top {
            display: inline-block;
            background: rgba(255, 26, 64, 0.1);
            color: #ff4d6d;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 3px;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 26, 64, 0.3);
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .main-title {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(255, 26, 64, 0.7), 0 0 10px rgba(255, 26, 64, 0.4);
            margin-bottom: 5px;
        }
        .sub-title {
            color: #8b8b9e;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .gang-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #dcdce6;
            font-size: 0.85rem;
            margin-bottom: 35px;
            letter-spacing: 2px;
            background: rgba(25, 25, 35, 0.5);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: #ff1a40;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff1a40;
        }
        .enter-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1f080c 0%, #0c0305 100%);
            border: 2px solid #ff1a40;
            color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 26, 64, 0.3), inset 0 0 15px rgba(255, 26, 64, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .enter-btn:hover {
            border-color: #ff4d6d;
            box-shadow: 0 0 35px rgba(255, 26, 64, 0.6), inset 0 0 20px rgba(255, 26, 64, 0.3);
        }
        .enter-btn:active {
            transform: scale(0.96);
            background: #ff1a40;
        }
        .btn-text {
            font-size: 1.15rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 6px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 26, 64, 0.8);
        }
        .btn-subtext {
            font-size: 0.68rem;
            color: #9a9ab0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="badge-top">Exclusive Roster</div>
        
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE ELITE GANG UNIVERSE</div>
        
        <div class="gang-info">
            <span class="dot"></span>
            <span>OFFICIAL MEMBER DIRECTORY</span>
            <span class="dot"></span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">EXPLORE MEMBERS</div>
            <div class="btn-subtext">[ CLICK TO ENTER GANG ROSTER ]</div>
        </a>
    </div>

</body>
</html>
