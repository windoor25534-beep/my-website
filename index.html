<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - UNIVERSE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #14080a 0%, #050507 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            background: rgba(15, 15, 20, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 26, 64, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }
        .main-title {
            color: #ff1a40;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(255, 26, 64, 0.8), 0 0 10px rgba(255, 26, 64, 0.5);
            margin-bottom: 8px;
        }
        .sub-title {
            color: #8b8b9e;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .discord-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #dcdce6;
            font-size: 0.9rem;
            margin-bottom: 35px;
            letter-spacing: 1.5px;
            background: rgba(255, 26, 64, 0.05);
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255, 26, 64, 0.2);
        }
        .diamond {
            color: #ff1a40;
            font-size: 0.75rem;
            text-shadow: 0 0 10px rgba(255, 26, 64, 1);
        }
        .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff1a40, transparent);
            margin: 0 auto 35px auto;
            box-shadow: 0 0 10px rgba(255, 26, 64, 0.8);
        }
        .enter-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, rgba(35, 10, 15, 0.9), rgba(15, 5, 8, 0.9));
            border: 2px solid #ff1a40;
            color: #ffffff;
            padding: 18px 20px;
            border-radius: 16px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(255, 26, 64, 0.35), inset 0 0 15px rgba(255, 26, 64, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 26, 64, 0.2), transparent);
            transition: 0.5s;
        }
        .enter-btn:hover::before {
            left: 100%;
        }
        .enter-btn:active {
            transform: scale(0.97);
            background: #ff1a40;
            box-shadow: 0 0 30px rgba(255, 26, 64, 0.8);
        }
        .btn-text {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2.5px;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 26, 64, 0.8);
        }
        .btn-subtext {
            font-size: 0.7rem;
            color: #9a9ab0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">DIS ONLYWIN UNIVERSE</div>
        
        <div class="divider"></div>

        <div class="discord-box">
            <span class="diamond">◆</span>
            <span>DISCORD ONLYWIN</span>
            <span class="diamond">◆</span>
        </div>

        <a href="roster.html" class="enter-btn">
            <div class="btn-text">MEMBER ENTER</div>
            <div class="btn-subtext">[ CLICK TO EXPLORE ROSTER & MUSIC ]</div>
        </a>
    </div>

</body>
</html>
