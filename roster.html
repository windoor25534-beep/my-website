<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - THE OFFICIAL MEMBERS ROSTER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #070709;
            color: #ffffff;
            padding: 15px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #1a1a24;
            padding-bottom: 12px;
        }
        .logo-text {
            color: #ff1a40;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 26, 64, 0.8);
        }
        .nav-btns {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(25, 25, 35, 0.8);
            color: #fff;
            border: 1px solid #333344;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            border-color: #ff1a40;
        }
        .main-title-container {
            text-align: center;
            margin: 25px 0 35px 0;
        }
        .main-title {
            color: #ff1a40;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 26, 64, 0.9), 0 0 10px rgba(255, 26, 64, 0.5);
            margin-bottom: 6px;
        }
        .sub-title {
            color: #9a9ab0;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ff1a40;
            margin: 30px 0 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid #222230;
            padding-bottom: 6px;
            letter-spacing: 1px;
        }
        .count-badge {
            font-size: 0.75rem;
            color: #8b8b9e;
            border: 1px solid #2c2c3b;
            background: #121218;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .empty-roster {
            text-align: center;
            padding: 30px;
            background: #111116;
            border: 1px dashed #333344;
            border-radius: 12px;
            color: #777788;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">ONLYWIN</div>
        <div class="nav-btns">
            <a href="index.html" class="btn">🏠 HOME</a>
            <a href="#" class="btn">👑 ADMIN</a>
        </div>
    </header>

    <div class="main-title-container">
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE OFFICIAL MEMBERS ROSTER</div>
    </div>

    <!-- LEADERS SECTION -->
    <div class="section-header">
        <span>👑 LEADERS</span>
        <span class="count-badge">[0]</span>
    </div>
    
    <div class="empty-roster">
        - พื้นที่ว่างสำหรับใส่รายชื่อ Leader -
    </div>

    <!-- VICE LEADERS SECTION -->
    <div class="section-header">
        <span>👑 VICE LEADERS</span>
        <span class="count-badge">[0]</span>
    </div>

    <div class="empty-roster">
        - พื้นที่ว่างสำหรับใส่รายชื่อ Vice Leader -
    </div>

</body>
</html>
