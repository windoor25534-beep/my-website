<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - THE OFFICIAL MEMBERS ROSTER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050507;
            color: #ffffff;
            padding: 15px;
            min-height: 100vh;
            position: relative;
        }

        /* เอฟเฟกต์แสงเหนือเคลื่อนไหวตลอดเวลา */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #050507, #1a1405, #050507, #261b07);
            background-size: 400% 400%;
            animation: auroraAnimation 12s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding-bottom: 12px;
            background: rgba(10, 10, 14, 0.5);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-radius: 12px;
        }
        .logo-text {
            color: #d4af37;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }
        .nav-btns {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(20, 18, 12, 0.9);
            color: #f3e5ab;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .btn:active {
            transform: scale(0.93);
            background: #d4af37;
            color: #050507;
        }
        .main-title-container {
            text-align: center;
            margin: 25px 0 35px 0;
        }
        .main-title {
            color: #d4af37;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7), 0 0 10px rgba(212, 175, 55, 0.4);
            margin-bottom: 6px;
        }
        .sub-title {
            color: #a3997c;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d4af37;
            margin: 30px 0 12px 0;
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        .count-badge {
            font-size: 0.75rem;
            color: #c4b998;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(18, 16, 10, 0.8);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .empty-roster {
            text-align: center;
            padding: 30px;
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(10px);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            color: #8c8268;
            font-size: 0.85rem;
            letter-spacing: 1px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <header>
        <div class="logo-text">ONLYWIN</div>
        <div class="nav-btns">
            <a href="index.html" class="btn">🏠 HOME</a>
            <a href="#" class="btn">👑 ADMIN</a>
        </div>
    </header>

    <div class="main-title-container">
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE OFFICIAL MEMBERS ROSTER</div>
    </div>

    <!-- GANG LEADER SECTION -->
    <div class="section-header">
        <span>👑 GANG LEADER</span>
        <span class="count-badge">[0]</span>
    </div>
    
    <div class="empty-roster">
        - พื้นที่ว่างสำหรับใส่รายชื่อ Gang Leader -
    </div>

    <!-- MEMBER GANG SECTION -->
    <div class="section-header">
        <span>🛡️ MEMBER GANG</span>
        <span class="count-badge">[0]</span>
    </div>

    <div class="empty-roster">
        - พื้นที่ว่างสำหรับใส่รายชื่อ Member Gang -
    </div>

</body>
</html>
