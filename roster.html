<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - THE OFFICIAL MEMBERS ROSTER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050507;
            color: #ffffff;
            padding: 15px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* เอฟเฟกต์แสงเหนือเคลื่อนไหวตลอดเวลาที่พื้นหลัง */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #050507, #1a1405, #050507, #261b07);
            background-size: 400% 400%;
            animation: auroraAnimation 12s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            background: rgba(10, 10, 14, 0.6);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            border-radius: 12px;
        }
        .logo-text {
            color: #d4af37;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7);
        }
        .nav-btns {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(20, 18, 12, 0.9);
            color: #f3e5ab;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .btn:active {
            transform: scale(0.93);
            background: #d4af37;
            color: #050507;
        }
        .main-title-container {
            text-align: center;
            margin: 20px 0 30px 0;
        }
        .main-title {
            color: #d4af37;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.7), 0 0 10px rgba(212, 175, 55, 0.4);
            margin-bottom: 4px;
        }
        .sub-title {
            color: #a3997c;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #d4af37;
            margin: 25px 0 12px 0;
            font-size: 0.95rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding-bottom: 6px;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        .count-badge {
            font-size: 0.7rem;
            color: #c4b998;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(18, 16, 10, 0.8);
            padding: 2px 8px;
            border-radius: 6px;
        }

        /* สไตล์การ์ดสมาชิกตามแบบฉบับเป๊ะๆ */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .member-card {
            background: rgba(15, 15, 22, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 14px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: 0.2s;
        }
        .member-card:hover {
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .member-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-container {
            position: relative;
        }
        .member-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        .crown-icon {
            position: absolute;
            top: -6px;
            right: -4px;
            font-size: 0.75rem;
            filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.9));
        }
        .member-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .member-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .member-role {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #f3e5ab;
            border: 1px solid rgba(212, 175, 55, 0.35);
            font-size: 0.6rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
            width: fit-content;
        }
        .social-icon-btn {
            width: 35px;
            height: 35px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f3e5ab;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-icon-btn:hover {
            background: #d4af37;
            color: #050507;
            box-shadow: 0 0 10px #d4af37;
        }
        .empty-slot {
            text-align: center;
            padding: 20px;
            background: rgba(15, 15, 20, 0.5);
            border: 1px dashed rgba(212, 175, 55, 0.25);
            border-radius: 12px;
            color: #8c8268;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <header>
        <div class="logo-text">ONLYWIN</div>
        <div class="nav-btns">
            <a href="index.html" class="btn">🏠 HOME</a>
            <a href="#" class="btn">👑 ADMIN</a>
        </div>
    </header>

    <div class="main-title-container">
        <div class="main-title">ONLYWIN</div>
        <div class="sub-title">THE OFFICIAL MEMBERS ROSTER</div>
    </div>

    <!-- GANG LEADER SECTION -->
    <div class="section-header">
        <span>👑 GANG LEADER</span>
        <span class="count-badge">[1]</span>
    </div>
    
    <div class="member-list">
        <!-- ตัวอย่างการ์ด Leader (ก็อปปี้บล็อกนี้ไปเพิ่มคนอื่นได้เลย) -->
        <div class="member-card">
            <div class="member-left">
                <div class="avatar-container">
                    <img src="https://cdn.discordapp.com/attachments/1542675599129317387/1550882045373456464/d3aaa0254037a7df2afa0d8e97060ec0_1.jpg?ex=6aaff2f5&is=6aaea175&hm=2b7b7713d5c8c918847098c656f0ab1011ee89650cb52529b600bb4a4ae73460&" alt="Avatar" class="member-avatar">
                    <span class="crown-icon">👑</span>
                </div>
                <div class="member-details">
                    <div class="member-name">onlywin</div>
                    <div class="member-role">LEADER</div>
                </div>
            </div>
            <!-- ปุ่มลิงก์โซเชียล (ไอคอนรูปกล้อง IG หรือเปลี่ยนเป็นตัวอักษรได้) -->
            <a href="https://www.instagram.com/wvpwvvp_?stkn=MWN2bW5sYnY2Mnh1bA==" target="_blank" class="social-icon-btn">
                IG
            </a>
        </div>
    </div>


    <!-- MEMBER GANG SECTION -->
    <div class="section-header">
        <span>🛡️ MEMBER GANG</span>
        <span class="count-badge">[0]</span>
    </div>

    <div class="empty-slot">
        - พื้นที่ว่างสำหรับใส่รายชื่อ Member Gang -
    </div>

</body>
</html>
