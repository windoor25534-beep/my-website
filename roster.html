<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYWIN - OFFICIAL MEMBERS ROSTER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #020204;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* พื้นหลังแสงเหนือเคลื่อนไหวระดับโปร */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(125deg, #020204, #1a1202, #020204, #291a03);
            background-size: 400% 400%;
            animation: auroraAnimation 12s ease infinite;
        }

        @keyframes auroraAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* เฮดเดอร์บนสุด */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(12, 12, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .logo-text {
            color: #f7e9b4;
            font-weight: 900;
            font-size: 1.25rem;
            letter-spacing: 2.5px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }
        .nav-btns {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(20, 16, 8, 0.9);
            color: #f7e9b4;
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .btn:hover {
            border-color: #fff1a8;
            background: rgba(212, 175, 55, 0.25);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .btn:active {
            transform: scale(0.93);
            background: #d4af37;
            color: #030305;
        }

        /* หัวข้อหลัก */
        .main-title-container {
            text-align: center;
            margin: 25px 0 35px 0;
        }
        .main-title {
            color: #d4af37;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.7), 0 0 10px rgba(212, 175, 55, 0.4);
            margin-bottom: 6px;
        }
        .sub-title {
            color: #9c9172;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* หัวข้อหมวดหมู่แก๊ง */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f7e9b4;
            margin: 35px 0 15px 0;
            font-size: 0.95rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        .count-badge {
            font-size: 0.7rem;
            color: #f7e9b4;
            border: 1px solid rgba(212, 175, 55, 0.35);
            background: rgba(18, 14, 8, 0.85);
            padding: 3px 10px;
            border-radius: 8px;
            box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.2);
        }

        /* การ์ดสมาชิกพรีเมียมดีไซน์ระดับเทพ */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .member-card {
            background: rgba(12, 12, 18, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(212, 175, 55, 0.05);
            transition: all 0.25s ease;
        }
        .member-card:hover {
            border-color: #fff1a8;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
        }
        .member-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        /* รูปโปรไฟล์และมงกุฎแบบลงตัว */
        .avatar-container {
            position: relative;
            width: 58px;
            height: 58px;
        }
        .member-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }
        .crown-icon {
            position: absolute;
            top: -7px;
            left: -5px;
            background: #141006;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            border: 1px solid #d4af37;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
            z-index: 2;
        }

        .member-details {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .member-name {
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
        .member-role {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: #f7e9b4;
            border: 1px solid rgba(212, 175, 55, 0.4);
            font-size: 0.6rem;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            width: fit-content;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        /* ปุ่มโซเชียลขวาขอบทองสุดเนี๊ยบ */
        .social-icon-btn {
            width: 44px;
            height: 44px;
            background: rgba(20, 16, 8, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f7e9b4;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        .social-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #f7e9b4;
            transition: 0.2s;
        }
        .social-icon-btn:hover {
            background: #d4af37;
            border-color: #fff;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
            transform: scale(1.05);
        }
        .social-icon-btn:hover svg {
            fill: #020204;
        }

        .empty-slot {
            text-align: center;
            padding: 22px;
            background: rgba(12, 12, 18, 0.5);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 14px;
            color: #8c8163;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
        }
    </style>
</head>
